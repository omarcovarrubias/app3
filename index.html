<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Antes / Después</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .dropzone {
      border: 2px dashed #aaa;
      border-radius: 8px;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #fff;
      text-align: center;
      cursor: pointer;
    }

    .dropzone img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .dropzone p {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 16px;
    }

    #generateBtn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #resultContainer {
      background-color: #fff;
      padding: 20px;
      border: 1px solid #ccc;
      width: 100%;
      max-width: 100%;
    }

    canvas {
      display: block;
      margin-bottom: 10px;
      width: 100%;
      height: auto;
    }

    .downloadBtn {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Generador Antes / Después</h1>
  <div class="container">
    <div class="dropzone" id="beforeDrop">
      <p>Arrastra o selecciona imagen "Antes"</p>
      <input type="file" accept="image/*" style="display:none">
    </div>
    <div class="dropzone" id="afterDrop">
      <p>Arrastra o selecciona imagen "Después"</p>
      <input type="file" accept="image/*" style="display:none">
    </div>
  </div>
  <button id="generateBtn">Generar Imagen Combinada</button>
  <div id="resultContainer" style="display:none;">
    <canvas id="resultCanvas"></canvas>
    <button class="downloadBtn" id="downloadBtn">Descargar Imagen</button>
  </div>

  <script>
    const beforeDrop = document.getElementById('beforeDrop');
    const afterDrop = document.getElementById('afterDrop');
    const generateBtn = document.getElementById('generateBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultCanvas = document.getElementById('resultCanvas');
    const downloadBtn = document.getElementById('downloadBtn');

    let beforeImage = null;
    let afterImage = null;

    function handleDrop(e, type) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;
      loadFile(file, type);
    }

    function handleFileSelect(e, type) {
      const file = e.target.files[0];
      if (!file) return;
      loadFile(file, type);
    }

    function loadFile(file, type) {
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = () => {
          if (type === 'before') beforeImage = img;
          if (type === 'after') afterImage = img;
          displayImage(img, type);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    }

    function displayImage(img, type) {
      const dropzone = type === 'before' ? beforeDrop : afterDrop;
      dropzone.innerHTML = '';
      dropzone.appendChild(img);
    }

    [beforeDrop, afterDrop].forEach((dropzone, idx) => {
      const type = idx === 0 ? 'before' : 'after';
      dropzone.addEventListener('dragover', e => e.preventDefault());
      dropzone.addEventListener('drop', e => handleDrop(e, type));
      dropzone.addEventListener('click', () => dropzone.querySelector('input').click());
      dropzone.querySelector('input').addEventListener('change', e => handleFileSelect(e, type));
    });

    generateBtn.addEventListener('click', () => {
      if (!beforeImage || !afterImage) {
        alert('Por favor, selecciona ambas imágenes.');
        return;
      }

      const gap = 10;
      const textSpace = 50;
      const screenWidth = window.innerWidth;
      const maxVisualWidth = screenWidth * 0.45;

      // Escalar imágenes proporcionalmente para 50% del ancho de pantalla
      const scaleBefore = maxVisualWidth / beforeImage.width;
      const scaleAfter = maxVisualWidth / afterImage.width;

      const beforeW = beforeImage.width * scaleBefore;
      const beforeH = beforeImage.height * scaleBefore;
      const afterW = afterImage.width * scaleAfter;
      const afterH = afterImage.height * scaleAfter;

      const targetHeight = Math.max(beforeH, afterH);

      resultCanvas.width = beforeW + afterW + gap;
      resultCanvas.height = targetHeight + textSpace;

      const ctx = resultCanvas.getContext('2d');

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

      ctx.drawImage(beforeImage, 0, 0, beforeW, beforeH);
      ctx.drawImage(afterImage, beforeW + gap, 0, afterW, afterH);

      ctx.fillStyle = '#000';
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Antes', beforeW / 2, targetHeight + 30);
      ctx.fillText('Después', beforeW + gap + afterW / 2, targetHeight + 30);

      resultContainer.style.display = 'block';
    });

    // Descargar exactamente como se ve en pantalla
    downloadBtn.addEventListener('click', () => {
      resultCanvas.toBlob(function (blob) {
        const link = document.createElement('a');
        link.download = 'antes_despues.png';
        link.href = URL.createObjectURL(blob);
        link.click();
      }, 'image/png');
    });
  </script>
</body>

</html>
